name: Verify release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          lfs: false
          persist-credentials: false
      - name: Download published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected v<major>.<minor>.<patch>' }
          $release = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the release' }
          $release | Set-Content -LiteralPath release.json -Encoding utf8NoBOM
          gh release download $env:RELEASE_TAG --dir release-assets `
            --pattern "Centurion-$env:RELEASE_TAG-nomm.zip" --pattern "Centurion-$env:RELEASE_TAG-nomnom.json" `
            --pattern "Centurion-$env:RELEASE_TAG-plugin-only.zip" --pattern RELEASE-NOTES.md --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the release assets' }
      - name: Verify checksums, manifest and archive contents
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ./tools/Verify-Release.ps1 -Directory release-assets -Tag $env:RELEASE_TAG -ReleaseJson release.json
